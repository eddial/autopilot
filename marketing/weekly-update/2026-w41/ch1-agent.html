<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>The Agent step</title>
<link rel="stylesheet" href="clip.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="chapter.css">
<style>
  .app { --node-coral: 15 45% 45%; --node-plum: 280 30% 42%; --node-mauve: 320 22% 45%; --node-slate: 220 15% 42%; --node-rose: 350 40% 42%;
    --node-amber: 35 50% 40%; --node-sky: 200 35% 42%; --node-forest: 145 30% 32%; --node-olive: 85 30% 38%; --node-teal: 170 35% 35%; }
  /* workflow-editor.tsx: React Flow dots (border colour, 15px gap, 2px) on the background */
  .canvas { position: relative; flex: 1; margin-top: 12px; border-top: 1px solid hsl(var(--border));
    background-color: hsl(var(--background)); background-image: radial-gradient(hsl(var(--border)) 1px, transparent 1.2px); background-size: 15px 15px; }
  /* node/basic-node.tsx + node-header.tsx + node-ref-pill.tsx */
  .node { position: absolute; width: 320px; background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 12px; box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
  .node.sel { border-color: hsl(var(--highlight)); box-shadow: 0 0 0 6.4px hsl(var(--highlight) / .2); }
  .nh { padding: 16px 16px 12px; }
  .nh .top { display: flex; align-items: center; justify-content: space-between; }
  .refpill { display: inline-flex; align-items: center; gap: 6px; height: 24px; border-radius: 999px; background: hsl(var(--border)); padding: 0 10px 0 2px; font-size: 12px; font-weight: 500; }
  .nic { width: 20px; height: 20px; border-radius: 999px; display: grid; place-items: center; color: #fff; }
  .nic svg { width: 10px; height: 10px; }
  .nh .tools { display: flex; gap: 10px; color: hsl(var(--muted-foreground)); }
  .nh .tools svg { width: 12px; height: 12px; }
  .nh .desc { margin-top: 10px; font-size: 14px; line-height: 20px; font-weight: 500; }
  .nb { border-top: 1px solid hsl(var(--border)); padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .fl { font-size: 12px; font-weight: 500; margin-bottom: 4px; }
  .fbox { border: 1px solid hsl(var(--input)); border-radius: 6px; padding: 6px 8px; min-height: 52px; font-size: 12px; line-height: 17px; background: hsl(var(--background)); }
  .fbox .ref { display: inline-flex; border-radius: 4px; background: hsl(var(--node-plum) / .12); color: hsl(var(--node-plum)); padding: 0 4px; font-weight: 500; }
  .pills { display: flex; gap: 6px; }
  .opill { display: inline-flex; align-items: center; gap: 5px; height: 24px; border: 1px solid hsl(var(--input)); border-radius: 999px; padding: 0 9px; font-size: 12px; }
  .opill svg { width: 10px; height: 10px; color: hsl(var(--muted-foreground)); }
  .sel2 { height: 30px; display: flex; align-items: center; justify-content: space-between; border: 1px solid hsl(var(--input)); border-radius: 6px; padding: 0 10px; font-size: 12px; }
  .sel2 svg { width: 9px; height: 9px; color: hsl(var(--muted-foreground)); }
  .handle { position: absolute; top: 24px; width: 10px; height: 10px; border-radius: 999px; border: 2px solid hsl(var(--muted-foreground)); background: hsl(var(--background)); }
  .handle.src { right: -6px; } .handle.tgt { left: -6px; }
  .handle.add { width: 16px; height: 16px; top: 21px; right: -9px; background: hsl(var(--highlight)); border-color: hsl(var(--highlight)); display: grid; place-items: center; color: #fff; }
  .handle.add svg { width: 8px; height: 8px; }
  svg.edge { position: absolute; left: 0; top: 0; overflow: visible; }
  /* add-node-dialog: 900 x 85vh, sidebar 230 muted, search 40px, 2-col grid, 24px coloured icon circles */
  .backdrop { position: absolute; inset: 0; background: rgb(0 0 0 / .45); z-index: 40; }
  .dlg { position: absolute; left: 190px; top: 60px; width: 900px; height: 680px; z-index: 41; background: hsl(var(--background)); border: 1px solid hsl(var(--border)); border-radius: 8px; display: flex; overflow: hidden;
    box-shadow: 0 25px 50px -12px rgb(0 0 0 / .25); }
  .dside { width: 230px; flex: none; background: hsl(var(--muted)); padding: 12px; display: flex; flex-direction: column; gap: 4px; }
  .dcat { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; font-size: 14px; font-weight: 500; color: hsl(var(--muted-foreground)); }
  .dcat i { width: 8px; height: 8px; border-radius: 999px; }
  .dcat.on { background: hsl(var(--background)); color: hsl(var(--foreground)); box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
  .dmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .dsearch { display: flex; gap: 8px; padding: 16px 24px 0; }
  .dsearch .in { flex: 1; height: 40px; border: 1px solid hsl(var(--input)); border-radius: 6px; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 14px; color: hsl(var(--muted-foreground)); }
  .dsearch .in svg { width: 14px; height: 14px; }
  .dsearch .ib { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: hsl(var(--muted-foreground)); }
  .dsearch .ib svg { width: 14px; height: 14px; }
  .dbody { padding: 16px 24px 32px; }
  .dsec { font-size: 14px; font-weight: 500; color: hsl(var(--muted-foreground)); margin: 0 0 8px; }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 16px; }
  .ditem { display: flex; gap: 12px; padding: 8px; border-radius: 8px; border: 1px solid transparent; }
  .ditem.hov { border-color: hsl(var(--border)); box-shadow: 0 1px 2px rgb(0 0 0 / .05); background: hsl(var(--card)); }
  .ditem .ci { width: 24px; height: 24px; border-radius: 999px; display: grid; place-items: center; color: #fff; flex: none; }
  .ditem .ci svg { width: 12px; height: 12px; }
  .ditem b { display: block; font-size: 14px; line-height: 14px; font-weight: 500; }
  .ditem span { display: block; margin-top: 4px; font-size: 14px; line-height: 20px; color: hsl(var(--muted-foreground)); }
</style></head>
<body>
<div class="frame">
  <div class="stage">
    <div class="app" id="app">
      <div id="sb"></div>
      <main class="panel">
        <div class="ph"><h1 id="pt">Overview</h1></div>
        <div class="canvas" id="canvas">
          <svg class="edge" width="1" height="1"><path id="edge" d="" fill="none" stroke="hsl(var(--muted-foreground))" stroke-width="1.5"/></svg>
          <div class="node" id="n1" style="left:70px;top:150px">
            <div class="nh"><div class="top"><span class="refpill"><span class="nic" style="background:hsl(var(--node-plum))" data-fa="s:faEnvelope"></span>orderEmail</span>
              <span class="tools"><span data-fa="faCode"></span><span data-fa="faEllipsis"></span></span></div>
              <div class="desc">A customer emails an order to orders@</div></div>
            <span class="handle src" id="h1"></span>
          </div>
          <div class="node" id="n2" style="left:520px;top:110px">
            <div class="nh"><div class="top"><span class="refpill"><span class="nic" style="background:hsl(var(--node-coral))" data-fa="s:faRobot"></span>agent</span>
              <span class="tools"><span data-fa="faPlay"></span><span data-fa="faCode"></span><span data-fa="faEllipsis"></span><span data-fa="faChevronUp"></span></span></div>
              <div class="desc">Turn the order email into a sales order</div></div>
            <div class="nb">
              <div><div class="fl">Message</div><div class="fbox" id="msg"></div></div>
              <div class="pills"><span class="opill"><span data-fa="faPuzzlePiece"></span>Add Skill</span><span class="opill"><span data-fa="faPaperclip"></span>Add Attachment</span></div>
              <div><div class="fl">Model</div><div class="sel2"><span>Claude Sonnet 5.5</span><span data-fa="faChevronDown"></span></div></div>
            </div>
            <span class="handle tgt"></span><span class="handle src"></span>
          </div>
        </div>
      </main>
      <div class="backdrop" id="backdrop"></div>
      <div class="dlg" id="dlg">
        <div class="dside" id="dside"></div>
        <div class="dmain">
          <div class="dsearch"><div class="in"><span data-fa="faMagnifyingGlass"></span><span id="ph">Search all actions...</span></div><span class="ib" data-fa="faBook"></span><span class="ib" data-fa="faXmark"></span></div>
          <div class="dbody" id="dbody"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="fa-icons.js"></script><script src="fa-extra.js"></script>
<script src="app.js"></script>
<script src="clip.js"></script>
<script src="chapter.js"></script>
<script>
  CHAPTER({ n: 1, total: 5, tag: "Agent step", kicker: "This week in Lleverage", where: true, footerLeft: "lleverage.ai · Week of 5 Oct 2026",
    title: "The Agent step,<br><em>now for everyone.</em>", line: "Hand a workflow task to an agent that can use tools, integrations and files." });
  const O = 2.7, D = 7.8 + O;
  window.HOLDS = [[1.0, 0.7], [4.1, 0.6], [4.15 + O, 1.0], [7.7 + O, 1.0]];
  const { $, $$, p, out, io } = C;
  $("#sb").outerHTML = APP.sidebar("Overview");
  const CATS = [["All", "foreground"], ["AI", "node-coral"], ["UI", "node-mauve"], ["Data Tables", "node-slate"], ["Operator Action", "node-mauve"], ["Advanced Coding", "node-rose"],
    ["Internal Data Sources", "node-amber"], ["Controls", "node-sky"], ["Display", "node-mauve"], ["External Data Sources", "node-forest"], ["File Processing", "node-olive"], ["Tools", "node-teal"], ["Workflows", "node-plum"], ["Integrations", "node-sky"]];
  $("#dside").innerHTML = CATS.map(([l, c], i) => `<div class="dcat" id="cat${i}"><i style="background:hsl(var(--${c}))"></i>${l}</div>`).join("");
  const item = ([t, d, ic, c], id = "") => `<div class="ditem" ${id}><span class="ci" style="background:hsl(var(--${c}))">${fa(ic)}</span><div><b>${t}</b><span>${d}</span></div></div>`;
  const AI = [["Agent", "Hand a task to an agent that can use tools, integrations and files", "s:faRobot", "node-coral"], ["Prompt", "Call a large language model", "faCommentCode", "node-coral"],
    ["Find Answers", "Find answers on the web using AI", "faMagnifyingGlass", "node-coral"], ["Browser Agent", "Automate web browser tasks using AI", "faGlobePointer", "node-coral"],
    ["Categorise Data", "Sort inputs into specified categories", "faTags", "node-coral"], ["Evaluate", "Validate AI outputs with safety checks and content moderation", "faShield", "node-coral"]];
  const allBody = `<div class="dsec">AI</div><div class="dgrid">${AI.map((x) => item(x)).join("")}</div>`;
  const aiBody = `<div class="dsec">AI</div><div class="dgrid">${AI.map((x, i) => item(x, i === 0 ? 'id="agB"' : "")).join("")}</div>`;
  $$("[data-fa]").forEach((el) => (el.innerHTML = fa(el.dataset.fa)));

  const app = $("#app");
  const at = (el, fx = 0.5, fy = 0.5) => { const a = app.getBoundingClientRect(), r = el.getBoundingClientRect(), s = a.width / 1280;
    return [(r.left - a.left + r.width * fx) / s, (r.top - a.top + r.height * fy) / s]; };
  const navs = $$(".sb .nav"), navWf = navs.find((el) => el.textContent.trim() === "Workflows"), navOv = navs.find((el) => el.textContent.trim() === "Overview");
  const cv = at($("#canvas"), 0, 0), h1 = at($("#h1")), n2 = at($("#n2"), 0, 0);
  const sx = h1[0] - cv[0] + 2, sy = h1[1] - cv[1], tx = n2[0] - cv[0] - 2, ty = n2[1] - cv[1] + 29;
  $("#edge").setAttribute("d", `M${sx},${sy} C${sx + 80},${sy} ${tx - 80},${ty} ${tx},${ty}`);
  const len = $("#edge").getTotalLength(); $("#edge").style.strokeDasharray = len;
  $("#dbody").innerHTML = allBody;
  const P = { wf: at(navWf, 0.3), h1: h1, ai: at($("#cat1")) };
  $("#dbody").innerHTML = aiBody; P.ag = at($("#agB"));
  const VW = C.STAGE_W, VH = C.STAGE_H, FIT = Math.min(VW / 1280, VH / 800) * 0.98;
  const cam = C.camera(app, VW, VH, [[0, 640, 400, FIT], [1.9, 640, 400, FIT], [2.3, 490, 300, 1.35], [3.2, 490, 300, 1.35], [3.8, 640, 400, FIT], [1.9 + O, 640, 400, FIT], [2.4 + O, 630, 400, 1.0], [4.9 + O, 630, 400, 1.0], [5.5 + O, 700, 400, 1.15], [D, 700, 400, 1.15]]);
  const F = (t, [x, y]) => { const m = cam(t).map(x, y); return [C.STAGE_X + m[0], C.STAGE_Y + m[1]]; };
  const OFF = [C.W * 0.6, C.H + 40];
  const cur = C.cursor([[1.9, ...OFF], [2.6, ...F(2.6, P.wf), true], [3.3, ...F(3.3, P.wf)], [2.0 + O, ...F(2.0 + O, P.h1)], [2.7 + O, ...F(2.7 + O, P.h1), true], [3.4 + O, ...F(3.4 + O, P.ai), true], [4.2 + O, ...F(4.2 + O, P.ag)], [4.5 + O, ...F(4.5 + O, P.ag), true], [5.2 + O, C.W * 0.9, C.H + 40]]);
  const where = C.where([[2.6, "Workflows"], [3.1, "Order intake"], [2.7 + O, "+ after a step"], [3.4 + O, "AI"], [4.5 + O, "Agent"]]);
  const cap = C.captions([
    [1.9, 4.3, "Open Workflows<br><em>and pick a workflow.</em>"],
    [1.9 + O, 4.55 + O, "Add a step.<br><em>Agent is first under AI.</em>"],
    [4.95 + O, 99, "Add it to the workflow.<br><em>Hand it the task.</em>"],
  ]);
  cam(0);
  const MSG = `Read the order email from <span class="ref">orderEmail</span>, match the customer and items in Exact Online, and draft the sales order. If the customer's PO number is missing, ask the order desk.`;
  C.run(D, (t) => {
    C.hook($("#hook"), t, 1.5);
    cap(t); cam(t); cur(t); where(t);
    // Beat 0: from the Overview into Workflows, then the workflow opens.
    const inWf = t >= 2.65;
    navWf.classList.toggle("on", inWf); navOv.classList.toggle("on", !inWf);
    $("#pt").textContent = t >= 3.1 ? "Order intake" : inWf ? "Workflows" : "Overview";
    const c = out(p(t, 3.1, 3.5));
    $("#canvas").style.opacity = c;
    // Hovering the trigger shows the orange add handle (basic-node source handle).
    const hov = t >= 2.4 + O && t < 4.6 + O;
    $("#h1").className = "handle src" + (hov ? " add" : "");
    $("#h1").innerHTML = hov ? fa("s:faPlus") : "";
    const open = t >= 2.75 + O && t < 4.6 + O;
    const d = out(p(t, 2.75 + O, 2.95 + O));
    $("#dlg").style.display = $("#backdrop").style.display = open ? "" : "none";
    $("#dlg").style.opacity = $("#backdrop").style.opacity = d;
    $("#dlg").style.transform = `scale(${0.97 + 0.03 * d})`;
    const ai = t >= 3.45 + O;
    $$(".dcat").forEach((el, i) => (el.className = "dcat" + ((ai ? i === 1 : i === 0) ? " on" : "")));
    $("#ph").textContent = ai ? "Search ai..." : "Search all actions...";
    const html = ai ? aiBody : allBody;
    if ($("#dbody").dataset.v !== String(ai)) { $("#dbody").innerHTML = html; $("#dbody").dataset.v = String(ai); }
    const ag = $("#agB"); if (ag) ag.className = "ditem" + (t >= 4.1 + O ? " hov" : "");
    // The Agent node lands and connects.
    const n = out(p(t, 4.65 + O, 5.0 + O));
    $("#n2").style.opacity = n; $("#n2").style.transform = `translateY(${(1 - n) * 10}px)`;
    $("#n2").className = "node" + (t >= 4.65 + O ? " sel" : "");
    $("#edge").style.strokeDashoffset = len * (1 - io(p(t, 4.7 + O, 5.1 + O)));
    const m = p(t, 5.6 + O, 7.4 + O);
    const plain = MSG.replace(/<[^>]+>/g, ""); const k = Math.round(plain.length * m);
    $("#msg").innerHTML = k >= plain.length ? MSG : plain.slice(0, k).replace("orderEmail", '<span class="ref">orderEmail</span>');
  });
</script>
</body></html>
