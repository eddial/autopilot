<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SSO invites</title>
<link rel="stylesheet" href="clip.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="chapter.css">
<style>
  .mem { padding: 20px 32px; display: flex; flex-direction: column; gap: 8px; }
  .mrow { display: flex; align-items: center; gap: 12px; background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 12px; padding: 12px 16px; }
  .mrow .uav { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; color: #fff; font-weight: 600; }
  .mrow b { display: block; font-weight: 500; } .mrow span.e { font-size: 12px; color: hsl(var(--muted-foreground)); }
  .mrow .role { margin-left: auto; }
  .backdrop { position: absolute; inset: 0; background: rgb(0 0 0 / .45); z-index: 40; }
  /* invite-link.tsx: Add Member dialog */
  .dlg { position: absolute; left: 400px; top: 170px; width: 512px; z-index: 41; background: hsl(var(--background)); border: 1px solid hsl(var(--border)); border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / .1), 0 4px 6px -4px rgb(0 0 0 / .1); }
  .dlg h2 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 600; }
  .dlg .ds { margin-top: 2px; font-size: 13px; color: hsl(var(--muted-foreground)); }
  .dlg .x { position: absolute; right: 16px; top: 16px; color: hsl(var(--muted-foreground)); } .dlg .x svg { width: 14px; height: 14px; }
  .lab { font-weight: 500; margin-bottom: 8px; } .lab i { font-style: normal; color: hsl(var(--muted-foreground)); font-weight: 400; }
  .ta2 { min-height: 60px; border: 1px solid hsl(var(--input)); border-radius: 6px; padding: 8px 12px; background: hsl(var(--background)); font-size: 14px; }
  .ta2.err { border-color: hsl(var(--destructive)); }
  .ta2 .ph { color: hsl(var(--muted-foreground)); }
  .caret { display: inline-block; width: 1px; height: 16px; background: hsl(var(--foreground)); vertical-align: -3px; }
  .msgline { margin-top: 8px; font-size: 12px; line-height: 17px; }
  .msgline.err { color: hsl(var(--destructive)); } .msgline.help { color: hsl(var(--muted-foreground)); }
  .acts { display: flex; justify-content: flex-end; gap: 8px; }
  .btn.dis { opacity: .5; }
</style></head>
<body>
<div class="frame">
  <div class="stage">
    <div class="app" id="app">
      <div id="sb"></div>
      <main class="panel">
        <div class="ph"><h1>Members</h1><div class="right"><span class="btn pri"><span data-fa="faUserPlus"></span>Add Member</span></div></div>
        <div class="mem" id="mem"></div>
      </main>
      <div class="backdrop"></div>
      <div class="dlg">
        <div><h2>Add Member</h2><div class="ds">Create a shareable link or send invitations to specific email addresses.</div></div>
        <span class="x" data-fa="faXmark"></span>
        <div><div class="lab">Email Addresses <i>(optional)</i></div>
          <div class="ta2" id="ta"><span id="typed"></span><span class="caret" id="caret"></span><span class="ph" id="ph">Enter emails (comma, semicolon or newline separated)</span></div>
          <div class="msgline" id="ml"></div></div>
        <div class="acts"><span class="btn out">Cancel</span><span class="btn pri" id="send">Send Invites</span></div>
      </div>
    </div>
  </div>
</div>
<script src="fa-icons.js"></script>
<script src="app.js"></script>
<script src="clip.js"></script>
<script src="chapter.js"></script>
<script>
  CHAPTER({ n: 5, total: 5, tag: "SSO invites", title: "SSO invites stay<br><em>on your domains.</em>",
    line: "With SSO on, invites only go to addresses on your organisation's domains." });
  const D = 7.8;
  window.HOLDS = [[1.0, 0.7], [4.4, 1.3], [7.7, 1.0]]; // pause on the title card, the first result and the final result
  const { $, $$, p } = C;
  $("#sb").outerHTML = APP.sidebar("Overview");
  const M = [["Sanne de Vries", "sanne@kuiperstrade.nl", "Owner", "hsl(280 30% 42%)"], ["Joris Bakker", "joris@kuiperstrade.nl", "Admin", "hsl(170 35% 35%)"], ["Mila Jansen", "mila@kuiperstrade.nl", "Member", "hsl(15 45% 45%)"]];
  $("#mem").innerHTML = M.map(([n, e, r, c]) => `<div class="mrow"><span class="uav" style="background:${c}">${n[0]}</span><div><b>${n}</b><span class="e">${e}</span></div><span class="badge role" style="border-color:hsl(var(--border))">${r}</span></div>`).join("");
  $$("[data-fa]").forEach((el) => (el.innerHTML = fa(el.dataset.fa)));
  const app = $("#app");
  const VW = C.STAGE_W, VH = C.STAGE_H;
  const cam = C.camera(app, VW, VH, [[0, 640, 400, 0.74], [1.9, 640, 400, 0.74], [2.4, 656, 330, 1.65], [D, 656, 330, 1.65]]);
  const cap = C.captions([
    [1.9, 4.55, "Invite a personal address.<br><em>The invite is refused.</em>"],
    [4.95, 9, "Use a company address.<br><em>The invite can go out.</em>"],
  ]);
  cam(0);
  const A = "bas.smit@gmail.com", B = "bas.smit@kuiperstrade.nl";
  const ERR = `This email address is not on an allowed domain: ${A}. Invites can only go to addresses at kuiperstrade.nl. An owner can allow members outside the SSO domains in the organisation's SSO settings.`;
  const HELP = "Leave empty for a generic link, which only people with an email address at kuiperstrade.nl can use. Emails sent automatically if provided.";
  C.run(D, (t) => {
    C.hook($("#hook"), t, 1.5);
    cap(t); cam(t);
    let txt = "";
    if (t >= 2.3 && t < 4.95) txt = A.slice(0, Math.round(A.length * p(t, 2.3, 3.4)));
    else if (t >= 4.95) { const keep = "bas.smit@"; const back = p(t, 4.95, 5.4), fwd = p(t, 5.5, 6.4);
      txt = fwd > 0 ? keep + B.slice(keep.length, keep.length + Math.round((B.length - keep.length) * fwd)) : A.slice(0, Math.round(A.length - (A.length - keep.length) * back)); }
    $("#typed").textContent = txt; $("#ph").style.display = txt ? "none" : "";
    $("#caret").style.opacity = t >= 2.2 && Math.floor(t * 2.4) % 2 === 0 || (t >= 2.3 && t < 6.5) ? 1 : 0;
    const bad = t >= 3.5 && t < 5.0;
    $("#ta").className = "ta2" + (bad ? " err" : "");
    $("#ml").className = "msgline " + (bad ? "err" : "help"); $("#ml").textContent = bad ? ERR : HELP;
    $("#send").className = "btn pri" + (bad || (t >= 5.0 && t < 6.45) ? " dis" : "");
  });
</script>
</body></html>
