<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Point the Agent at what you mean</title>
<link rel="stylesheet" href="clip.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="parts/agent-chat.css">
<link rel="stylesheet" href="parts/data-table.css">
<link rel="stylesheet" href="chapter.css">
<style>
  /* Pointing (PR 9791, origin/main 4 Nov 2026): agent-point-button.tsx, a ghost icon button with faArrowPointer next
     to the plus in the agent sidebar's message box, variant "selected" while on (border-highlight bg-highlight/10).
     While pointing, items outline on hover (agent-context-target.tsx: outline-dashed outline-1 outline-highlight,
     offset 2px) and the pointer is a crosshair; a click adds the innermost item as a chip under the message box
     (agent-context-chips.tsx: Chip, rounded-full bg-muted px-2.5 py-0.5 text-xs, the kind's icon, "label: value",
     an x), and the added item keeps its dashed outline. Sent, the chip sits inline in the bubble, tinted, no icon. */
  .app { --ring: 60 7% 60%; }
  .btn.pri { background: hsl(var(--highlight)); color: hsl(var(--highlight-foreground)); }
  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .page .body { margin-top: 12px; padding: 4px 24px 24px; }
  .ph { padding: 16px 24px 0; }
  .tb .search { width: 180px; }
  td { padding: 0 12px; }
  th { padding: 0 12px; font-weight: 500; color: hsl(var(--muted-foreground)); }
  td.m { font-family: "Roboto Mono", ui-monospace, monospace; font-size: 12px; }
  td.r, th.r { text-align: right; }
  .st { display: inline-flex; border-radius: 999px; border: 1px solid; padding: 2px 10px; font-size: 12px; line-height: 16px; }
  .st.d { color: hsl(210 45% 40%); border-color: hsl(210 45% 40% / .3); background: hsl(210 45% 45% / .08); }
  .st.h { color: hsl(35 60% 34%); border-color: hsl(35 50% 40% / .35); background: hsl(35 50% 45% / .1); }
  .st.b { color: hsl(145 35% 30%); border-color: hsl(145 35% 35% / .3); background: hsl(145 35% 35% / .08); }
  .hlbox { position: absolute; pointer-events: none; outline: 1px dashed hsl(var(--highlight)); outline-offset: 2px; border-radius: 2px; display: none; z-index: 5; }
  /* The agent sidebar beside the page (agent-sidebar.tsx, bg muted, width --agent-sidebar-width). */
  .as { padding: 8px 12px 12px; }
  .as-head { justify-content: space-between; padding: 0 4px 0 8px; }
  .as-head .ttl { display: flex; align-items: center; gap: 6px; }
  .as-head .ttl svg { width: 10px; height: 10px; color: hsl(var(--muted-foreground)); }
  .as-head .acts { display: flex; gap: 2px; }
  .as-head .acts span { width: 32px; height: 32px; display: grid; place-items: center; color: hsl(var(--muted-foreground)); }
  .as-head .acts svg { width: 13px; height: 13px; }
  .as .msgs { padding-bottom: 8px; }
  .prose { font-size: 13px; line-height: 20px; }
  .prose p { margin: 0 0 6px; }
  .bubble { font-size: 13px; line-height: 20px; padding: 6px 8px; background: hsl(var(--card)); }
  .as-empty { flex: 1; display: flex; align-items: center; justify-content: center; }
  .composer { border-radius: 12px; box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
  .composer .ta { padding: 8px 6px 2px; }
  .composer .ta div { font-size: 13px; }
  .composer .ta div.typed { color: hsl(var(--foreground)); }
  .composer .row { padding: 0 6px 6px; }
  .composer .l { display: flex; align-items: center; gap: 2px; }
  .ib2 { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: hsl(var(--muted-foreground)); border: 1px solid transparent; }
  .ib2 svg { width: 14px; height: 14px; }
  .ib2.sel { border-color: hsl(var(--highlight)); background: hsl(var(--highlight) / .1); color: hsl(var(--foreground)); }
  .rb.send { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; min-height: 30px; }
  .chp { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; background: hsl(var(--muted)); border: 1px solid hsl(var(--border)); padding: 2px 10px; font-size: 12px; line-height: 16px; }
  .chp svg { width: 12px; height: 12px; color: hsl(var(--muted-foreground)); }
  .chp.tint { background: hsl(var(--highlight) / .15); border-color: transparent; margin-right: 4px; }
  .status { padding: 0 4px 8px; font-size: 13px; }
</style></head>
<body>
<div class="frame">
  <div class="stage">
    <div class="app" id="app">
      <div id="sb"></div>
      <main class="panel both" id="main">
        <div class="page">
          <div class="ph">
            <div class="th-title"><h1>Orders</h1><span data-fa="faChevronDown" data-s="width:12px;height:12px;color:hsl(var(--muted-foreground))"></span></div>
            <div class="right"><span class="btn pri"><span data-fa="faPlus"></span>New Record</span></div>
          </div>
          <div class="body">
            <div class="tcard" id="tcard">
              <div class="tb">
                <span class="btn out"><span data-fa="faFilter"></span>Filter</span>
                <span class="input search"><span data-fa="faMagnifyingGlass"></span>Search records...</span>
                <div class="rt"><span class="btn out ico" data-fa="faEye"></span><span class="btn out ico" data-fa="faDownload"></span><span class="btn out ico" data-fa="faSliders"></span></div>
              </div>
              <table id="grid">
                <colgroup><col style="width:44px"><col style="width:104px"><col><col style="width:116px"><col style="width:112px"></colgroup>
                <tr><th class="n">#</th><th>Order</th><th>Customer</th><th>Status</th><th class="r">Total</th></tr>
              </table>
              <div class="hlbox" id="hl"></div>
            </div>
          </div>
        </div>
      </main>
      <aside class="as" id="as">
        <div class="as-head"><span class="ttl">New session <span data-fa="faChevronDown"></span></span>
          <span class="acts"><span data-fa="faPlus"></span><span data-fa="faArrowUpRightAndArrowDownLeftFromCenter"></span><span data-fa="faXmark"></span></span></div>
        <div class="msgs" id="msgs">
          <div class="msg user" id="u1" style="display:none"><span class="av">TG</span><div class="bubble"><span class="chp tint">SO-20487: On hold</span><span id="u1t"></span></div></div>
          <div class="msg" id="a1" style="display:none"><span class="avl" id="av1"></span><div class="prose"><div id="t1"></div></div></div>
        </div>
        <div class="as-empty" id="asEmpty"><span id="asLogo"></span></div>
        <div class="status" id="status"><span id="stl"></span><span id="stt"></span></div>
        <div class="composer" id="composer">
          <div class="ta"><div id="ta">Ask Lleverage anything</div></div>
          <div class="row"><span class="l"><span class="ib2" id="plus"></span><span class="ib2" id="point"></span></span>
            <div class="r"><span class="model">Opus 5.5 <span id="mchev"></span></span><span class="rb" id="mic"></span><span class="rb" id="sendb"></span></div></div>
        </div>
        <div class="chips" id="chips"><span class="chp" id="chip" style="display:none"><span data-fa="faFileLines"></span>SO-20487: On hold<span data-fa="faXmark"></span></span></div>
      </aside>
    </div>
  </div>
</div>
<script src="fa-icons.js"></script>
<script src="app.js"></script>
<script src="clip.js"></script>
<script src="chapter.js"></script>
<script>
  CHAPTER({ n: 4, total: 7, module: "Agent", footerLeft: "Feature Drop · Week 46",
    title: "Point the Agent<br><em>at what you mean.</em>",
    line: "A pointer button next to the plus in the agent sidebar's message box: click a row, a cell or a widget and it joins your next message, with the value you clicked." });
  const D = 12.4;
  window.HOLDS = [[4.5, 0.6], [11.2, 1.4]];
  const { $, $$, p, out, io } = C;
  $("#sb").outerHTML = APP.sidebar("Intelligence", "Order intake", { recents: ["Invoice 2026-0412", "Weekly order report", "Smit Elektro order"] });
  $$("[data-fa]").forEach((el) => (el.innerHTML = fa(el.dataset.fa, "", el.dataset.s || "")));
  $$(".avl").forEach((el) => (el.outerHTML = `<span id="${el.id}" style="display:block;margin-top:2px;flex:none;color:hsl(var(--foreground))">${APP.loader(20)}</span>`));
  $("#stl").innerHTML = APP.loader(20); $("#asLogo").innerHTML = APP.loader(28);
  $("#mchev").innerHTML = fa("faChevronDown", "", "width:9px;height:9px");
  $("#plus").innerHTML = lu("plus", "", "width:16px;height:16px"); $("#mic").innerHTML = fa("faMicrophone");
  $("#point").innerHTML = fa("faArrowPointer");
  const ROWS = [
    ["SO-20491", "Van Dijk Metaal", "Drafted", "d", "€6,480.00"],
    ["SO-20490", "Bakker Installatietechniek", "Booked", "b", "€1,872.50"],
    ["SO-20489", "Smit Elektro", "Booked", "b", "€944.20"],
    ["SO-20488", "Smit Elektro", "Drafted", "d", "€3,940.00"],
    ["SO-20487", "Kuipers Hout", "On hold", "h", "€1,215.40"],
    ["SO-20486", "Van Dijk Metaal", "Booked", "b", "€8,722.10"],
    ["SO-20485", "Bakker Installatietechniek", "Booked", "b", "€604.00"],
    ["SO-20484", "Smit Elektro", "Booked", "b", "€2,310.75"],
    ["SO-20483", "Kuipers Hout", "Booked", "b", "€1,148.90"],
    ["SO-20482", "Van Dijk Metaal", "Booked", "b", "€5,215.00"],
    ["SO-20481", "Bakker Installatietechniek", "Booked", "b", "€736.40"],
    ["SO-20480", "Smit Elektro", "Booked", "b", "€1,994.60"],
    ["SO-20479", "Kuipers Hout", "Booked", "b", "€2,086.30"],
    ["SO-20478", "Van Dijk Metaal", "Booked", "b", "€3,412.80"],
    ["SO-20477", "Smit Elektro", "Booked", "b", "€821.15"],
    ["SO-20476", "Bakker Installatietechniek", "Booked", "b", "€4,075.00"],
    ["SO-20475", "Kuipers Hout", "Booked", "b", "€1,530.25"],
    ["SO-20474", "Van Dijk Metaal", "Booked", "b", "€2,948.70"],
  ];
  $("#grid").insertAdjacentHTML("beforeend", ROWS.map((r, i) => `<tr id="row${i}"><td class="n">${i + 1}</td><td class="m">${r[0]}</td><td>${r[1]}</td><td><span class="st ${r[3]}"${r[3] === "h" ? ' id="held"' : ""}>${r[2]}</span></td><td class="r tnum">${r[4]}</td></tr>`).join(""));
  const ASK = "Why is this one on hold?";
  $("#u1t").textContent = ASK;
  const T1 = "Kuipers Hout's order of €1,215.40 is waiting for their PO number. Their order confirmation came in on 4 November without one. Eva asked them for it the same day.";

  const app = $("#app"), row = $("#row4"), tcard = $("#tcard");
  const at = (el, fx = 0.5, fy = 0.5) => { const a = app.getBoundingClientRect(), r = el.getBoundingClientRect(), s = a.width / 1280;
    return [(r.left - a.left + r.width * fx) / s, (r.top - a.top + r.height * fy) / s]; };
  // The outline box over the held order's row, in the table card's coordinates.
  const s0 = app.getBoundingClientRect().width / 1280, tr0 = tcard.getBoundingClientRect(), rr = row.getBoundingClientRect();
  Object.assign($("#hl").style, { left: `${(rr.left - tr0.left) / s0 + 1}px`, top: `${(rr.top - tr0.top) / s0}px`, width: `${rr.width / s0 - 2}px`, height: `${rr.height / s0 - 1}px` });
  // Measure in each click's layout: the point button and the held cell before anything is sent; send with text typed.
  const P = { point: at($("#point")), cell: at($("#held")) };
  $("#ta").textContent = ASK; $("#sendb").className = "rb send"; $("#sendb").innerHTML = fa("faArrowUp");
  P.send = at($("#sendb"));
  const VW = C.STAGE_W, VH = C.STAGE_H, FIT = Math.min(VW / 1280, VH / C.APP_H) * 0.98;
  // The one zoom: the agent sidebar, framed on its own edges (its left edge to the window's right, down to the
  // window's bottom), as the question goes in and the answer lands.
  const a0 = at($("#as"), 0, 0), a1 = at($("#as"), 1, 1), ZS = VW / (a1[0] - a0[0]);
  const ZOOM = [(a0[0] + a1[0]) / 2, C.APP_H - VH / ZS / 2, ZS];
  const FULL = [640, C.APP_H / 2, FIT];
  const cam = C.camera(app, VW, VH, [[0, ...FULL], [5.6, ...FULL], [6.2, ...ZOOM], [D, ...ZOOM]]);
  const F = (t, [x, y]) => { const m = cam(t).map(x, y); return [C.STAGE_X + m[0], C.STAGE_Y + m[1]]; };
  const OFF = (fx) => [C.W * fx, C.H + 40];
  const cur = C.cursor([[2.0, ...OFF(0.75)], [2.55, ...F(2.55, P.point)], [2.8, ...F(2.8, P.point), true],
    [3.7, ...F(3.7, P.cell)], [4.2, ...F(4.2, P.cell), true], [4.9, ...OFF(0.45)],
    [7.6, ...OFF(0.85)], [8.0, ...F(8.0, P.send)], [8.25, ...F(8.25, P.send), true], [8.7, ...OFF(0.9)]]);
  // The pointer is a crosshair while pointing.
  const curSvg = $(".cursor svg"), ARROW = curSvg.innerHTML;
  const CROSS = `<path d="M3 -5v16M-5 3h16" stroke="#fff" stroke-width="4.2" stroke-linecap="round"/><path d="M3 -5v16M-5 3h16" stroke="#141413" stroke-width="1.8" stroke-linecap="round"/>`;
  curSvg.setAttribute("overflow", "visible");
  const cap = C.captions([
    [1.9, 5.3, "Turn on pointing.<br><em>Click the order you mean.</em>"],
    [5.6, 99, "Ask about it.<br><em>The Agent knows which one.</em>"],
  ]);
  C.typing(6.4, 7.5);
  cam(0);
  C.run(D, (t) => {
    cap(t); cam(t); cur(t);
    const pointing = t >= 2.85;
    $("#point").classList.toggle("sel", pointing);
    curSvg.innerHTML = pointing && t < 4.9 ? CROSS : ARROW;
    // Hover outline from when the pointer reaches the row; it stays once the order is added.
    const onRow = t >= 3.55 && t < 8.3;
    $("#hl").style.display = pointing && onRow ? "block" : "none";
    const added = t >= 4.25;
    $("#chip").style.display = added && t < 8.3 ? "" : "none";
    $("#chip").style.opacity = out(p(t, 4.25, 4.5));
    const sent = t >= 8.3;
    const k = !sent ? Math.round(ASK.length * p(t, 6.4, 7.5)) : 0;
    $("#ta").textContent = k ? ASK.slice(0, k) : "Ask Lleverage anything"; $("#ta").className = k ? "typed" : "";
    $("#sendb").className = "rb" + (k || added ? " send" : ""); $("#sendb").innerHTML = k ? fa("faArrowUp") : fa("s:faPhoneFlip");
    if (!k) $("#sendb").className = "rb";
    $("#asEmpty").style.display = sent ? "none" : "";
    $("#msgs").style.display = sent ? "" : "none";
    $("#u1").style.display = sent ? "" : "none";
    $("#a1").style.display = t >= 8.5 ? "" : "none";
    C.type($("#t1"), T1, t, 9.3, 10.2, null);
    const st = !sent ? null : t < 9.3 ? "Thinking" : t < 10.2 ? "Responding" : null;
    $("#status").style.visibility = st ? "visible" : "hidden"; $("#stt").textContent = st || "";
    APP.drive($("#stl"), st ? "working" : "static", t);
    APP.drive($("#av1"), t >= 8.5 && t < 10.2 ? "working" : "static", t);
  });
</script>
</body></html>
